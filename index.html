<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#eef1f7" />
  <meta name="description" content="本地优先的个人工作台：番茄、任务、速记、笔记、日记、统计、白噪音、成就，离线可用，数据自持。" />
  <title>个人工作台</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- 左侧可收缩侧边栏 -->
  <div id="scrim" class="scrim"></div>
  <aside id="sidebar" class="sidebar">
    <div class="side-head">
      <div class="avatar">🐼</div>
      <div>
        <div class="side-name">个人工作台</div>
        <div class="side-sub" id="sideSub">本地优先 · 离线可用</div>
      </div>
    </div>
    <nav id="sideNav" class="side-nav"></nav>
    <div class="side-foot">v1 · 数据仅存本机</div>
  </aside>

  <header class="appbar">
    <button id="menuBtn" class="icon-btn" title="菜单" aria-label="菜单">☰</button>
    <h1 id="appTitle">主页</h1>
    <div class="appbar-actions">
      <button id="themeToggle" class="icon-btn" title="切换主题" aria-label="切换主题">🌙</button>
      <button id="settingsBtn" class="icon-btn" title="设置" aria-label="设置">⚙️</button>
    </div>
  </header>

  <main id="view" class="view"></main>

  <div id="modalRoot"></div>
  <div id="toast" class="toast"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
